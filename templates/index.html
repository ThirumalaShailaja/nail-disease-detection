<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nail Disease Detection</title>
    <style>
        body {
            background: linear-gradient(to right, #74ebd5, #9face6);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            color: #333;
        }

        input[type="file"] {
            margin-top: 15px;
        }

        button {
            margin-top: 15px;
            padding: 10px 25px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #45a049;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f4f4f4;
            border-radius: 10px;
        }

        img {
            margin-top: 15px;
            border-radius: 10px;
            max-width: 100%;
            height: auto;
        }

        .disease {
            font-size: 20px;
            color: #e91e63;
            font-weight: bold;
        }

        .confidence {
            font-size: 18px;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Nail Disease Detection</h2>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <br>
        <button type="submit">Predict</button>
    </form>

    {% if img_path %}
        <img src="{{ url_for('static', filename=img_path) }}" alt="Uploaded Image">
    {% endif %}

    {% if prediction %}
    <div class="result">
        <div class="disease">Disease: {{ prediction }}</div>
        <div class="confidence">Confidence: {{ confidence }}%</div>
    </div>
    {% endif %}
</div>

</body>
</html>
